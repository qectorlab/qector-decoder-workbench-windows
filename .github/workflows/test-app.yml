name: Test macOS App & DMG

on:
  workflow_dispatch:

# Least privilege: read-only checkout; releases are downloaded anonymously.
permissions:
  contents: read

jobs:
  test-dmg-execution:
    name: Verify v1.0.2 DMG on Apple Silicon (macos-14)
    runs-on: macos-14

    steps:
      - name: Report Apple Silicon runner environment
        run: |
          echo "Architecture : $(uname -m)"
          echo "macOS Version: $(sw_vers -productVersion)"
          sysctl -n machdep.cpu.brand_string || true

      - name: Download release DMG and checksum
        run: |
          echo "Fetching v1.0.2 release assets from GitHub..."
          curl -fSL -o QectorWorkbench-1.0.2-arm64.dmg \
            https://github.com/iD01t/QECTOR-Workbench-MacOS/releases/download/v1.0.2/QectorWorkbench-1.0.2-arm64.dmg
          curl -fSL -o SHA256SUMS.txt \
            https://github.com/iD01t/QECTOR-Workbench-MacOS/releases/download/v1.0.2/SHA256SUMS.txt
          
          ls -lh QectorWorkbench-1.0.2-arm64.dmg SHA256SUMS.txt

      - name: Validate SHA-256 Checksum
        run: |
          EXPECTED_SHA=$(grep "QectorWorkbench-1.0.2-arm64.dmg" SHA256SUMS.txt | awk '{print $1}')
          ACTUAL_SHA=$(shasum -a 256 QectorWorkbench-1.0.2-arm64.dmg | awk '{print $1}')
          
          echo "Expected SHA256: $EXPECTED_SHA"
          echo "Actual SHA256:   $ACTUAL_SHA"
          
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "ERROR: SHA256 checksum mismatch!"
            exit 1
          fi
          echo "SHA256 checksum verified successfully."

      - name: Attach DMG Disk Image
        run: |
          echo "Attaching DMG to /Volumes/QectorWorkbench..."
          hdiutil attach QectorWorkbench-1.0.2-arm64.dmg -mountpoint /Volumes/QectorWorkbench -nobrowse -readonly
          ls -la /Volumes/QectorWorkbench/

      - name: Verify Bundle Structure & Executable Permissions
        run: |
          APP="/Volumes/QectorWorkbench/QectorWorkbench.app"
          BIN="$APP/Contents/MacOS/QectorWorkbench"
          
          test -d "$APP" || { echo "Missing QectorWorkbench.app"; exit 1; }
          test -x "$BIN" || { echo "Binary not executable: $BIN"; exit 1; }
          
          echo "Bundle validated at: $APP"
          echo "Binary validated at: $BIN"
          file "$BIN"

      - name: Test Baseline Execution — CLI Version
        run: |
          BIN="/Volumes/QectorWorkbench/QectorWorkbench.app/Contents/MacOS/QectorWorkbench"
          echo "--- Running version check ---"
          "$BIN" --cli version

      - name: Test Baseline Execution — Decoder Self-Test
        run: |
          BIN="/Volumes/QectorWorkbench/QectorWorkbench.app/Contents/MacOS/QectorWorkbench"
          echo "--- Running full decoder selftest ---"
          "$BIN" --decoder-selftest

      - name: Test Baseline Execution — Diagnostics
        run: |
          BIN="/Volumes/QectorWorkbench/QectorWorkbench.app/Contents/MacOS/QectorWorkbench"
          echo "--- Running system diagnostics ---"
          "$BIN" --cli diagnostics

      - name: Test Baseline Execution — Live Quantum Syndrome Decode
        run: |
          BIN="/Volumes/QectorWorkbench/QectorWorkbench.app/Contents/MacOS/QectorWorkbench"
          echo "--- Running live syndrome decode (Rotated Surface d=5 Blossom) ---"
          "$BIN" --cli decode --family rotated_surface --distance 5 --decoder blossom

      - name: Test Baseline Execution — Benchmark Simulation
        run: |
          BIN="/Volumes/QectorWorkbench/QectorWorkbench.app/Contents/MacOS/QectorWorkbench"
          echo "--- Running benchmark (Rotated Surface d=5 Blossom, 100 samples) ---"
          "$BIN" --cli benchmark --family rotated_surface --distance 5 --decoder blossom --samples 100

      - name: Detach DMG Volume
        if: always()
        run: |
          if [ -d "/Volumes/QectorWorkbench" ]; then
            echo "Detaching /Volumes/QectorWorkbench..."
            hdiutil detach /Volumes/QectorWorkbench -force || true
          fi

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24
autorestart=true
stderr_logfile=/var/log/xvfb.log

[program:xfce4-session]
command=/usr/bin/xfce4-session
environment=DISPLAY=:1
autorestart=true
stderr_logfile=/var/log/xfce4.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -rfbauth /root/.vnc/passwd
environment=DISPLAY=:1
autorestart=true
stderr_logfile=/var/log/x11vnc.log

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autorestart=true
stderr_logfile=/var/log/novnc.log

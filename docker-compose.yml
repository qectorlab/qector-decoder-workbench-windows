services:
  kali-gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
      args:
        # REQUIRED: pass a strong password, e.g.
        #   VNC_PASSWORD=... docker compose build
        VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in your environment before building}
    container_name: kali-gui
    ports:
      # Bound to loopback only — do NOT expose VNC/noVNC on all interfaces.
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6080:6080"

<?xml version="1.0" encoding="UTF-8"?>
<!-- QECTOR monochrome icon — single color, optimized for small sizes / system tray -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#111827"/>

  <g clip-path="url(#roundedClip)" fill="none" stroke="#e2e8f0" stroke-linecap="round" stroke-linejoin="round">

    <!-- Lattice grid lines -->
    <g stroke-width="2" opacity="0.25">
      <line x1="82"  y1="92"  x2="430" y2="92"/>
      <line x1="82"  y1="150" x2="430" y2="150"/>
      <line x1="82"  y1="208" x2="430" y2="208"/>
      <line x1="82"  y1="266" x2="430" y2="266"/>
      <line x1="82"  y1="324" x2="430" y2="324"/>
      <line x1="82"  y1="382" x2="430" y2="382"/>
      <line x1="82"  y1="440" x2="430" y2="440"/>
      <line x1="82"  y1="82"  x2="82"  y2="440"/>
      <line x1="140" y1="82"  x2="140" y2="440"/>
      <line x1="198" y1="82"  x2="198" y2="440"/>
      <line x1="256" y1="82"  x2="256" y2="440"/>
      <line x1="314" y1="82"  x2="314" y2="440"/>
      <line x1="372" y1="82"  x2="372" y2="440"/>
      <line x1="430" y1="82"  x2="430" y2="440"/>
    </g>

    <!-- Normal qubit dots -->
    <g fill="#94a3b8" stroke="none" opacity="0.45">
      <circle cx="82"  cy="92"  r="6"/> <circle cx="140" cy="92"  r="6"/>
      <circle cx="198" cy="92"  r="6"/> <circle cx="256" cy="92"  r="6"/>
      <circle cx="314" cy="92"  r="6"/> <circle cx="372" cy="92"  r="6"/>
      <circle cx="430" cy="92"  r="6"/>
      <circle cx="82"  cy="150" r="6"/> <circle cx="140" cy="150" r="6"/>
      <circle cx="198" cy="150" r="6"/>
      <circle cx="372" cy="150" r="6"/> <circle cx="430" cy="150" r="6"/>
      <circle cx="82"  cy="208" r="6"/> <circle cx="140" cy="208" r="6"/>
      <circle cx="198" cy="208" r="6"/>
      <circle cx="372" cy="208" r="6"/> <circle cx="430" cy="208" r="6"/>
      <circle cx="82"  cy="266" r="6"/> <circle cx="140" cy="266" r="6"/>
      <circle cx="372" cy="266" r="6"/> <circle cx="430" cy="266" r="6"/>
      <circle cx="82"  cy="324" r="6"/> <circle cx="140" cy="324" r="6"/>
      <circle cx="198" cy="324" r="6"/>
      <circle cx="314" cy="324" r="6"/>
      <circle cx="372" cy="324" r="6"/> <circle cx="430" cy="324" r="6"/>
      <circle cx="82"  cy="382" r="6"/> <circle cx="140" cy="382" r="6"/>
      <circle cx="198" cy="382" r="6"/>
      <circle cx="314" cy="382" r="6"/>
      <circle cx="372" cy="382" r="6"/>
      <circle cx="82"  cy="440" r="6"/> <circle cx="140" cy="440" r="6"/>
      <circle cx="198" cy="440" r="6"/> <circle cx="256" cy="440" r="6"/>
      <circle cx="314" cy="440" r="6"/> <circle cx="372" cy="440" r="6"/>
      <circle cx="430" cy="440" r="6"/>
    </g>

    <!-- Syndrome/correction path (highlighted, full white) -->
    <g stroke="#e2e8f0" stroke-width="5" opacity="0.9">
      <line x1="198" y1="150" x2="256" y2="150"/>
      <line x1="256" y1="150" x2="314" y2="150"/>
      <line x1="140" y1="208" x2="140" y2="266"/>
      <line x1="372" y1="208" x2="372" y2="266"/>
      <line x1="198" y1="150" x2="140" y2="208"/>
      <line x1="314" y1="150" x2="372" y2="208"/>
      <line x1="372" y1="266" x2="314" y2="324"/>
      <line x1="256" y1="208" x2="256" y2="266"/>
      <line x1="140" y1="266" x2="198" y2="324"/>
      <line x1="198" y1="324" x2="256" y2="324"/>
      <line x1="314" y1="324" x2="372" y2="382"/>
      <line x1="372" y1="382" x2="430" y2="382"/>
    </g>

    <!-- Highlighted syndrome nodes -->
    <g fill="#ffffff" stroke="none">
      <circle cx="198" cy="150" r="9"/>
      <circle cx="256" cy="150" r="11"/>
      <circle cx="314" cy="150" r="9"/>
      <circle cx="140" cy="208" r="9"/>
      <circle cx="140" cy="266" r="9"/>
      <circle cx="372" cy="208" r="9"/>
      <circle cx="372" cy="266" r="9"/>
      <circle cx="256" cy="208" r="9"/>
      <circle cx="256" cy="266" r="13"/>
      <circle cx="198" cy="324" r="9"/>
      <circle cx="256" cy="324" r="9"/>
      <circle cx="314" cy="324" r="9"/>
      <circle cx="372" cy="382" r="9"/>
      <circle cx="430" cy="382" r="8" opacity="0.7"/>
    </g>

    <!-- Error site (filled white square for mono) -->
    <rect x="307" y="201" width="14" height="14" rx="2" fill="#ffffff" stroke="none"/>

  </g>
</svg>

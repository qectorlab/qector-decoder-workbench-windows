[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qector-workbench"
version = "1.0.2"
description = "Professional QEC analysis suite built on qector-decoder-v3"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [{name = "Guillaume Lessard / iD01t Productions", email = "admin@qector.store"}]
keywords = ["quantum", "error-correction", "decoder", "qec", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "customtkinter>=5.2.0",
    "numpy>=1.24",
    "scipy>=1.9",
    "matplotlib>=3.8",
    "Pillow>=9.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "qector-decoder-v3>=0.6.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "isort>=5.12",
    "bandit>=1.7",
    "pip-audit>=2.6",
    "mypy>=1.5",
    "ruff>=0.1",
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://www.qector.store"
"Commercial licensing" = "https://qector.store/pricing"

[project.scripts]
qector = "main:launch"

[project.gui-scripts]
qector-gui = "main:launch"

[tool.setuptools]
py-modules = [
    "main",
    "app",
    "backend",
    "state",
    "theme",
    "utils",
    "logger",
    "console",
    "version",
    "version_service",
    "decoder_provisioner",
    "doc_generator",
    "threading_utils",
    "results_tracker",
    "hardware_routing",
    "mcp_server",
    "mcp_resources",
    "dialogs",
    "autodebug",
    "cli",
    "generate_manuals",
    "api_reference",
    "docs_exporter",
    "code_explorer_tab",
    "decoder_lab_tab",
    "benchmark_tab",
    "batch_streaming_tab",
    "hardware_tab",
    "diagnostics_tab",
    "documentation_tab",
    "lab_info_tab",
    "compliance",
    "entra_auth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint.per-file-ignores]
# test_mcp_all.py inserts the repo root on sys.path before importing local
# modules, so those imports intentionally follow executable code.
"test_mcp_all.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["build/", "dist/", "\\.venv/"]
# Every GUI module defines its tab class twice — a real CustomTkinter subclass
# under `if _HAS_GUI:` and a headless no-op stub under `else:`. That deliberate
# idiom trips no-redef; disable just that code project-wide.
disable_error_code = ["no-redef"]

[tool.bandit]
exclude_dirs = ["dist", "build", ".venv", "__pycache__"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
